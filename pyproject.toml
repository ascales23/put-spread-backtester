[project]
name = "putspread"
version = "0.1.0"
description = "Backtester for the support-bounce bull put spread credit strategy"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "pyarrow==18.1.0",
    "matplotlib==3.9.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/putspread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
